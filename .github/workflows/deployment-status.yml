name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: deployment-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      previous_sha: ${{ steps.capture_info.outputs.previous_sha }}
      current_sha: ${{ steps.capture_info.outputs.current_sha }}
      short_sha: ${{ steps.capture_info.outputs.short_sha }}
      package_version: ${{ steps.capture_info.outputs.package_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint (quality check)
        run: npm run lint

      - name: Run tests (quality check)
        run: npm test

      - name: Capture deployment info
        id: capture_info
        run: |
          set -euo pipefail
          CURRENT_SHA="${GITHUB_SHA}"
          SHORT_SHA="${CURRENT_SHA:0:7}"

          # Capture previous commit SHA from the push event payload when possible.
          PREVIOUS_SHA="${{ github.event.before }}"
          if [ -z "${PREVIOUS_SHA}" ] || [ "${PREVIOUS_SHA}" = "0000000000000000000000000000000000000000" ]; then
            PREVIOUS_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo "${CURRENT_SHA}")"
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${PREVIOUS_SHA}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Current SHA:   ${CURRENT_SHA}"
          echo "Previous SHA:  ${PREVIOUS_SHA}"
          echo "Short SHA:     ${SHORT_SHA}"
          echo "Pkg Version:   ${PACKAGE_VERSION}"

      - name: Create deployment tracking issue
        id: create_issue
        uses: actions/github-script@v7
        env:
          PREVIOUS_SHA: ${{ steps.capture_info.outputs.previous_sha }}
          CURRENT_SHA: ${{ steps.capture_info.outputs.current_sha }}
          SHORT_SHA: ${{ steps.capture_info.outputs.short_sha }}
          PACKAGE_VERSION: ${{ steps.capture_info.outputs.package_version }}
        with:
          script: |
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const shortSha = process.env.SHORT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;

            const title = `Deployment Tracking - ${shortSha}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## 🚀 Deployment Tracking',
              '',
              `- Previous Commit: \`${previousSha}\``,
              `- Current Commit: \`${currentSha}\``,
              `- Package Version: \`${packageVersion}\``,
              `- Triggered by: @${context.actor}`,
              `- Workflow Run: [#${context.runId}](${runUrl})`,
              '',
              '### Pipeline Stages',
              '- [ ] Pre-deployment quality checks',
              '- [ ] Rollback artifact preparation',
              '- [ ] Post-deployment verification'
            ].join('
');

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['deployment', 'in-progress']
            });

            core.setOutput('issue_number', created.data.number);
            core.info(`Created deployment tracking issue #${created.data.number}`);

      - name: Comment - pre-deployment summary
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.create_issue.outputs.issue_number }}
          PREVIOUS_SHA: ${{ steps.capture_info.outputs.previous_sha }}
          CURRENT_SHA: ${{ steps.capture_info.outputs.current_sha }}
          PACKAGE_VERSION: ${{ steps.capture_info.outputs.package_version }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;

            const body = [
              '## ✅ Pre-deployment checks completed',
              '',
              'All baseline quality gates passed and deployment metadata has been captured.',
              '',
              `- Previous Commit: \`${previousSha}\``,
              `- Current Commit: \`${currentSha}\``,
              `- Package Version: \`${packageVersion}\``,
              '',
              '### Quality Gate Summary',
              '- ✅ Lint passed (`npm run lint`)',
              '- ✅ Tests passed (`npm test`)',
              '- ✅ Deployment metadata captured',
              '',
              'Proceeding to rollback preparation stage.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    outputs:
      artifact_name: ${{ steps.compress.outputs.artifact_name }}
      archive_file: ${{ steps.compress.outputs.archive_file }}
      sha256: ${{ steps.compress.outputs.sha256 }}
      script_created: ${{ steps.create_script.outputs.script_created }}
      backup_done: ${{ steps.backup_config.outputs.backup_done }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize rollback workspace
        run: |
          set -euo pipefail
          mkdir -p rollback-package/config-backup
          mkdir -p rollback-package/scripts
          mkdir -p rollback-artifacts

      - name: Create executable rollback script
        id: create_script
        run: |
          set -euo pipefail
          cat > rollback-package/rollback.sh <<'ROLLBACK_EOF'
          #!/usr/bin/env bash
          # ----------------------------------------------------------------------
          # Rollback Script
          # Restores the previous known-good deployment.
          # Usage:
          #   PREVIOUS_SHA=<sha> ./rollback.sh
          #   ./rollback.sh <previous-sha>
          # ----------------------------------------------------------------------
          set -euo pipefail
          IFS=$'
	'

          log() {
            printf '[rollback] %s
' "$*"
          }

          die() {
            printf '[rollback][error] %s
' "$*" >&2
            exit 1
          }

          on_error() {
            local exit_code=$?
            local line_no=$1
            die "Rollback failed at line ${line_no} with exit code ${exit_code}"
          }
          trap 'on_error $LINENO' ERR

          PREVIOUS_SHA="${PREVIOUS_SHA:-${1:-}}"
          if [[ -z "${PREVIOUS_SHA}" ]]; then
            die "PREVIOUS_SHA must be provided via env var or first argument"
          fi

          command -v git >/dev/null 2>&1 || die "git is required to perform rollback"
          command -v node >/dev/null 2>&1 || die "node is required to perform rollback"
          command -v npm >/dev/null 2>&1 || die "npm is required to perform rollback"

          log "Starting rollback to ${PREVIOUS_SHA}"

          if [[ -d .git ]]; then
            log "Fetching latest refs"
            git fetch --all --tags --prune
            log "Checking out ${PREVIOUS_SHA}"
            git checkout --detach "${PREVIOUS_SHA}"
          else
            die "Not a git repository - cannot perform git-based rollback"
          fi

          if [[ -f config-backup/package.json && -f config-backup/package-lock.json ]]; then
            log "Restoring backed-up package manifests"
            cp config-backup/package.json ./package.json
            cp config-backup/package-lock.json ./package-lock.json
          fi

          log "Reinstalling dependencies"
          npm ci

          if [[ -x scripts/verify-dependencies.sh ]]; then
            log "Verifying dependency compatibility"
            ./scripts/verify-dependencies.sh
          fi

          log "Rollback complete - service restored to ${PREVIOUS_SHA}"
          ROLLBACK_EOF

          chmod +x rollback-package/rollback.sh

          if [[ -x rollback-package/rollback.sh ]] && bash -n rollback-package/rollback.sh; then
            echo "script_created=true" >> "$GITHUB_OUTPUT"
            echo "Rollback script created: true"
          else
            echo "script_created=false" >> "$GITHUB_OUTPUT"
            echo "Rollback script created: false" >&2
            exit 1
          fi

      - name: Backup configuration files
        id: backup_config
        run: |
          set -euo pipefail

          cp package.json rollback-package/config-backup/package.json
          cp package-lock.json rollback-package/config-backup/package-lock.json

          cat > rollback-package/config-backup/.env.template <<'ENV_EOF'
          # Environment template (no secrets stored here).
          # Populate with appropriate values when restoring.
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=info
          ENV_EOF

          cat > rollback-package/config-backup/README.md <<'BACKUP_README_EOF'
          # Configuration Backup
          Snapshot of the configuration files associated with the previous
          deployment. Use these to restore the runtime configuration before
          executing `rollback.sh`.

          - `package.json`           - dependency manifest at deployment time
          - `package-lock.json`      - exact dependency tree at deployment time
          - `.env.template`          - non-secret environment variable template
          BACKUP_README_EOF

          if [[ -f rollback-package/config-backup/package.json \
                && -f rollback-package/config-backup/package-lock.json \
                && -f rollback-package/config-backup/.env.template ]]; then
            echo "backup_done=true" >> "$GITHUB_OUTPUT"
            echo "Configuration backup: true"
          else
            echo "backup_done=false" >> "$GITHUB_OUTPUT"
            echo "Configuration backup: false" >&2
            exit 1
          fi

      - name: Create dependency verification script
        run: |
          set -euo pipefail
          cat > rollback-package/scripts/verify-dependencies.sh <<'VERIFY_EOF'
          #!/usr/bin/env bash
          # ----------------------------------------------------------------------
          # Dependency Compatibility Verification
          # Ensures the runtime is compatible with the manifest before / after
          # rollback.
          # ----------------------------------------------------------------------
          set -euo pipefail

          log() { printf '[verify] %s
' "$*"; }
          die() { printf '[verify][error] %s
' "$*" >&2; exit 1; }

          command -v node >/dev/null 2>&1 || die "Node.js is not installed"
          command -v npm  >/dev/null 2>&1 || die "npm is not installed"

          [[ -f package.json ]] || die "package.json missing"
          [[ -f package-lock.json ]] || die "package-lock.json missing"

          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          REQUIRED_NODE="$(node -p "(require('./package.json').engines && require('./package.json').engines.node) || ''")"

          log "Node version:        ${NODE_VERSION}"
          log "npm version:         ${NPM_VERSION}"
          log "Required Node range: ${REQUIRED_NODE:-(not specified)}"

          log "Validating dependency tree (npm ls)"
          if ! npm ls --all >/tmp/npm-ls.log 2>&1; then
            log "npm ls reported issues - see /tmp/npm-ls.log"
          else
            log "Dependency tree is consistent"
          fi

          log "Dependency verification complete"
          VERIFY_EOF
          chmod +x rollback-package/scripts/verify-dependencies.sh
          bash -n rollback-package/scripts/verify-dependencies.sh

      - name: Create rollback documentation
        env:
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
        run: |
          set -euo pipefail
          cat > rollback-package/ROLLBACK.md <<DOC_EOF
          # Rollback Documentation

          This package contains everything required to roll back the deployment
          identified below to the immediately preceding known-good revision.

          ## Deployment Metadata
          - Previous Commit: \`${PREVIOUS_SHA}\`
          - Current Commit:  \`${CURRENT_SHA}\`
          - Package Version: \`${PACKAGE_VERSION}\`

          ## Bundle Contents
          - \`rollback.sh\`                       - executable rollback driver
          - \`scripts/verify-dependencies.sh\`    - dependency compatibility checker
          - \`config-backup/package.json\`        - dependency manifest snapshot
          - \`config-backup/package-lock.json\`   - exact dependency tree snapshot
          - \`config-backup/.env.template\`       - environment variable template
          - \`config-backup/README.md\`           - backup overview
          - \`manifest.json\`                     - bundle metadata
          - \`ROLLBACK.md\`                       - this document

          ## Step-by-Step Rollback Instructions

          1. **Download** the rollback artifact from the GitHub Actions run that
             produced this bundle, or fetch it from your artifact storage.
          2. **Verify integrity** with the SHA256 checksum that accompanies the
             archive (\`sha256sum -c <archive>.sha256\`).
          3. **Extract** the archive into the deployment directory:
             \`\`\`bash
             tar -xzf rollback-package-<short-sha>.tar.gz
             cd rollback-package
             \`\`\`
          4. **Verify dependencies** in the target environment:
             \`\`\`bash
             ./scripts/verify-dependencies.sh
             \`\`\`
          5. **Restore configuration** by copying files from \`config-backup/\`
             into the working tree if necessary.
          6. **Execute the rollback** with the previous commit SHA:
             \`\`\`bash
             export PREVIOUS_SHA=${PREVIOUS_SHA}
             ./rollback.sh
             \`\`\`
          7. **Validate** the restored deployment by running smoke tests and
             health checks (\`npm test\`, \`npm run health-check\`).

          ## Quick Rollback
          \`\`\`bash
          export PREVIOUS_SHA=${PREVIOUS_SHA}
          ./rollback.sh
          \`\`\`

          ## Safety Notes
          - The rollback script uses \`set -euo pipefail\` and an \`ERR\` trap to
            halt on any unexpected failure.
          - Always rehearse the rollback in a staging environment when feasible.
          - Keep the rollback artifact retained for a minimum of 30 days.
          DOC_EOF

      - name: Create bundle manifest
        env:
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          SHORT_SHA: ${{ needs.pre-deployment.outputs.short_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
        run: |
          set -euo pipefail
          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > rollback-package/manifest.json <<MANIFEST_EOF
          {
            "previous_sha": "${PREVIOUS_SHA}",
            "current_sha": "${CURRENT_SHA}",
            "short_sha": "${SHORT_SHA}",
            "package_version": "${PACKAGE_VERSION}",
            "created_at": "${CREATED_AT}",
            "workflow_run": "${GITHUB_RUN_ID}",
            "repository": "${GITHUB_REPOSITORY}"
          }
          MANIFEST_EOF
          cat rollback-package/manifest.json

      - name: Compress rollback package and compute checksum
        id: compress
        env:
          SHORT_SHA: ${{ needs.pre-deployment.outputs.short_sha }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="rollback-package-${SHORT_SHA}"
          ARCHIVE_FILE="${ARTIFACT_NAME}.tar.gz"

          tar -czf "rollback-artifacts/${ARCHIVE_FILE}" -C rollback-package .

          ( cd rollback-artifacts && sha256sum "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256" )
          SHA256="$(awk '{print $1}' "rollback-artifacts/${ARCHIVE_FILE}.sha256")"

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_file=${ARCHIVE_FILE}"   >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}"               >> "$GITHUB_OUTPUT"

          echo "Artifact:  ${ARTIFACT_NAME}"
          echo "Archive:   ${ARCHIVE_FILE}"
          echo "SHA256:    ${SHA256}"

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compress.outputs.artifact_name }}
          path: |
            rollback-artifacts/${{ steps.compress.outputs.archive_file }}
            rollback-artifacts/${{ steps.compress.outputs.archive_file }}.sha256
            rollback-package/**
          retention-days: 30
          if-no-files-found: error

      - name: Comment - rollback plan ready
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          SHORT_SHA: ${{ needs.pre-deployment.outputs.short_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          ARTIFACT_NAME: ${{ steps.compress.outputs.artifact_name }}
          ARCHIVE_FILE: ${{ steps.compress.outputs.archive_file }}
          SHA256: ${{ steps.compress.outputs.sha256 }}
          SCRIPT_CREATED: ${{ steps.create_script.outputs.script_created }}
          BACKUP_DONE: ${{ steps.backup_config.outputs.backup_done }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const artifactName = process.env.ARTIFACT_NAME;
            const archiveFile = process.env.ARCHIVE_FILE;
            const sha256 = process.env.SHA256;
            const scriptCreated = process.env.SCRIPT_CREATED;
            const backupDone = process.env.BACKUP_DONE;

            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              'A complete rollback bundle has been generated, checksummed, and uploaded as a workflow artifact.',
              '',
              `- Previous Commit: \`${previousSha}\``,
              `- Current Commit: \`${currentSha}\``,
              `- Package Version: \`${packageVersion}\``,
              `- Artifact: \`${artifactName}\``,
              '',
              '### Rollback Components',
              '- ✅ Executable rollback script (`rollback.sh`) with `set -euo pipefail` and `ERR` trap',
              '- ✅ Configuration backups (`package.json`, `package-lock.json`, `.env.template`)',
              '- ✅ Dependency verification script (`scripts/verify-dependencies.sh`)',
              '- ✅ Detailed rollback documentation (`ROLLBACK.md`) with step-by-step instructions',
              '- ✅ Compressed rollback package with SHA256 checksum',
              '- ✅ Bundle manifest (`manifest.json`) with deployment metadata',
              '',
              '### Quick Rollback',
              '```bash',
              `export PREVIOUS_SHA=${previousSha}`,
              `tar -xzf ${archiveFile}`,
              './rollback.sh',
              '```',
              '',
              '### Verification Status',
              `- Rollback script created: ${scriptCreated}`,
              `- Configuration backup: ${backupDone}`,
              `- Archive: \`${archiveFile}\``,
              `- SHA256: ${sha256}`,
              `- Retention: 30 days`,
              '',
              'Proceeding to post-deployment verification.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs:
      - pre-deployment
      - rollback-preparation
    steps:
      - name: Update labels and post final summary
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          SHORT_SHA: ${{ needs.pre-deployment.outputs.short_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          ARTIFACT_NAME: ${{ needs.rollback-preparation.outputs.artifact_name }}
          ARCHIVE_FILE: ${{ needs.rollback-preparation.outputs.archive_file }}
          SHA256: ${{ needs.rollback-preparation.outputs.sha256 }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const artifactName = process.env.ARTIFACT_NAME;
            const archiveFile = process.env.ARCHIVE_FILE;
            const sha256 = process.env.SHA256;

            // Remove the in-progress label (tolerate missing label).
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
              core.info('Removed in-progress label');
            } catch (err) {
              core.warning(`Could not remove in-progress label: ${err.message}`);
            }

            // Add the completed label.
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });
            core.info('Added completed label');

            // Post the final summary comment.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## ✅ Deployment Completed Successfully',
              '',
              'All deployment pipeline stages have finished without error.',
              '',
              `- Previous Commit: \`${previousSha}\``,
              `- Current Commit: \`${currentSha}\``,
              `- Package Version: \`${packageVersion}\``,
              '',
              '### Rollback Artifact Details',
              `- Artifact: \`${artifactName}\``,
              `- Archive: \`${archiveFile}\``,
              `- SHA256: \`${sha256}\``,
              '- Retention: 30 days',
              `- Workflow Run: [#${context.runId}](${runUrl})`,
              '',
              'The rollback bundle remains available should a rollback be required. Closing this tracking issue.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

            // Close the deployment tracking issue.
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
            core.info(`Closed deployment tracking issue #${issueNumber}`);
